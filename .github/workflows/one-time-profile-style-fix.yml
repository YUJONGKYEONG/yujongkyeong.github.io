name: One-time profile style fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-profile-style-fix.yml

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace red accents and enlarge the main photo
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          yellow = "#f4d451"
          red_colours = (
              "#ff0000", "#f44336", "#ef4444", "#e53935", "#e74c3c",
              "#dc2626", "#d32f2f", "#d9534f", "#c62828", "#c0392b",
              "#b91c1c", "#a61b1b", "#8b0000", "#8b3d3e", "#e63946",
              "#ff4d4f", "#d80000", "#b22222",
          )
          for old in red_colours:
              text = text.replace(old, yellow).replace(old.upper(), yellow)
          text = re.sub(r"(?i)(?P<prefix>[:\s])red(?=\s*[;,)])", rf"\g<prefix>{yellow}", text)

          marker = "/* 2026-11-28: yellow accents and larger main profile photo */"
          if marker not in text:
              override = base64.b64decode("").decode("utf-8")
              closing = "</style>"
              if closing not in text:
                  raise SystemExit("index.html does not contain a closing style tag")
              text = text.replace(closing, override + "\n" + closing, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate and publish
        shell: bash
        run: |
          git diff --check
          if git diff --quiet -- index.html; then
            echo "No profile change was needed."
            exit 0
          fi
          git config user.name "YUJONGKYEONG"
          git config user.email "jongkyeongyu@gmail.com"
          git add index.html
          git commit -m "Use yellow accents and enlarge the main profile photo"
          git push origin HEAD:main
